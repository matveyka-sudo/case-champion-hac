x-logs: &logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-runtime: &runtime
  image: waydex-full-api:${WAYDEX_REVISION:?}
  build:
    context: ${WAYDEX_SOURCE_DIR:?}
    dockerfile: infra/full-stack/api.Dockerfile
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 1g
  cpus: 2
  pids_limit: 128
  logging: *logs
  environment: &environment
    DATABASE_URL: postgresql://waydex:${POSTGRES_PASSWORD:?}@postgres:5432/waydex
    DATABASE_SCHEMA: waydex_full
    A2_DATA_DIR: /app/data
    A2_CONTRACT_VERSION: "2"
    A2_REGISTRY_HOOK: ${A2_REGISTRY_HOOK:-a2_api.adapters.walk_pilot:registry}
    A2_PREFLIGHT_HOOK: ${A2_PREFLIGHT_HOOK:-a2_api.adapters.walk_pilot:preflight}
    A2_CALCULATION_HANDLER: ${A2_CALCULATION_HANDLER:-a2_api.adapters.walk_pilot:calculate}
    A2_CODE_VERSION: full-${WAYDEX_REVISION:?}-${WAYDEX_ARTIFACT_SHA256:?}${WAYDEX_PRODUCT_SHA256:+-}${WAYDEX_PRODUCT_SHA256:-}
    A2_WALK_PILOT_ARTIFACT_PATH: /runtime/walk-artifact.json
    A2_WALK_PILOT_ARTIFACT_SHA256: ${WAYDEX_ARTIFACT_SHA256:?}
    A2_WALK_PILOT_EVIDENCE_DIR: /observations
    A2_PRODUCT_RUNTIME_PATH: ${WAYDEX_PRODUCT_PATH:-}
    A2_PRODUCT_RUNTIME_SHA256: ${WAYDEX_PRODUCT_SHA256:-}
    WAYDEX_PARENT_ARTIFACT_PATH: /input/parent-artifact.json
    WAYDEX_PARENT_SHA256: ${WAYDEX_PARENT_SHA256:?}
    WAYDEX_GRAPH_PATH: /data
  volumes: &runtime-volumes
    - type: bind
      source: ${WAYDEX_GRAPH_DIR:?}
      target: /data
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${WAYDEX_PARENT_ARTIFACT:?}
      target: /input/parent-artifact.json
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${WAYDEX_DEPLOYMENT_DIR:?}
      target: /runtime
      read_only: true
      bind: {create_host_path: false}
    - observations:/observations

services:
  graph-check:
    <<: *runtime
    command: [/app/.venv/bin/python, infra/full-stack/runtime.py, graph-check]
    restart: "no"

  valhalla:
    image: ghcr.io/valhalla/valhalla@sha256:4ac3d13d1019f9a130e9e6b6924c16ea55da0fa51e3653039152e33ad4095661
    command: [valhalla_service, /data/valhalla.json, "1"]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${WAYDEX_GRAPH_DIR:?}
        target: /data
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      graph-check: {condition: service_completed_successfully}
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    logging: *logs
    restart: unless-stopped

  runtime-check:
    <<: *runtime
    command: [/app/.venv/bin/python, infra/full-stack/runtime.py, verify]
    depends_on:
      valhalla: {condition: service_started}
    restart: "no"

  postgres:
    image: postgis/postgis:17-3.7@sha256:e11c40a6b74adfcdc703ab92094a0d36254eb3e4e2e3e0981b39dbfbff8cca56
    platform: linux/amd64
    environment:
      POSTGRES_DB: waydex
      POSTGRES_USER: waydex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U waydex -d waydex]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 768m
    cpus: 2
    pids_limit: 128
    logging: *logs
    restart: unless-stopped

  migrate:
    <<: *runtime
    command: [/app/.venv/bin/alembic, -c, /app/apps/api/alembic.ini, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
      runtime-check: {condition: service_completed_successfully}
    restart: "no"

  api:
    <<: *runtime
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *runtime
    command: [/app/.venv/bin/python, -m, a2_api.workers.cli, worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, infra/full-stack/runtime.py, worker-health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    image: waydex-full-web:${WAYDEX_REVISION:?}
    build:
      context: ${WAYDEX_SOURCE_DIR:?}
      dockerfile: infra/full-stack/web.Dockerfile
    ports: ["127.0.0.1:${WAYDEX_HTTP_PORT:-5190}:8080"]
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    logging: *logs
    restart: unless-stopped

volumes:
  postgres_data:
  observations:
