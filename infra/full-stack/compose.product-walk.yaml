# Optional physical walk executor for the generic product stack.
# Use after compose.product.yaml; accepted-input-only profiles need neither file.
x-walk-environment: &walk-environment
  A2_CODE_VERSION: full-${WAYDEX_REVISION:?}-${WAYDEX_PRODUCT_SHA256:?}-${WAYDEX_ARTIFACT_SHA256:?}
  A2_WALK_PILOT_ARTIFACT_PATH: /runtime/walk-artifact.json
  A2_WALK_PILOT_ARTIFACT_SHA256: ${WAYDEX_ARTIFACT_SHA256:?}
  A2_WALK_PILOT_EVIDENCE_DIR: /observations

services:
  graph-check:
    image: waydex-full-api:${WAYDEX_REVISION:?}
    command: [/app/.venv/bin/python, infra/full-stack/runtime.py, graph-check]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      WAYDEX_PARENT_ARTIFACT_PATH: /input/parent-artifact.json
      WAYDEX_PARENT_SHA256: ${WAYDEX_PARENT_SHA256:?}
      WAYDEX_GRAPH_PATH: /data
    volumes:
      - type: bind
        source: ${WAYDEX_GRAPH_DIR:?}
        target: /data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WAYDEX_PARENT_ARTIFACT:?}
        target: /input/parent-artifact.json
        read_only: true
        bind: {create_host_path: false}
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: "no"

  valhalla:
    image: ghcr.io/valhalla/valhalla@sha256:4ac3d13d1019f9a130e9e6b6924c16ea55da0fa51e3653039152e33ad4095661
    command: [valhalla_service, /data/valhalla.json, "1"]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${WAYDEX_GRAPH_DIR:?}
        target: /data
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      graph-check: {condition: service_completed_successfully}
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped

  runtime-check:
    environment:
      <<: *walk-environment
      WAYDEX_PARENT_ARTIFACT_PATH: /input/parent-artifact.json
      WAYDEX_PARENT_SHA256: ${WAYDEX_PARENT_SHA256:?}
      WAYDEX_GRAPH_PATH: /data
    volumes:
      - type: bind
        source: ${WAYDEX_GRAPH_DIR:?}
        target: /data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WAYDEX_PARENT_ARTIFACT:?}
        target: /input/parent-artifact.json
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      valhalla: {condition: service_started}

  migrate:
    environment: *walk-environment

  api:
    environment: *walk-environment

  worker:
    environment: *walk-environment
