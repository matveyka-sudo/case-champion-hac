server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/waydex-app.conf;
}

server {
    listen 80;
    server_name waydex.mhimf.net;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/waydex-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://waydex.mhimf.net$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name waydex.mhimf.net;
    ssl_certificate /etc/letsencrypt/live/waydex.mhimf.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waydex.mhimf.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/waydex-app.conf;
}
