services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: waydex
      POSTGRES_USER: waydex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U waydex -d waydex]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    image: waydex-api:${WAYDEX_REVISION:?}
    build:
      context: ${SOURCE_DIR:?}
      dockerfile: ${WAYDEX_CONFIG_DIR:?}/api.Dockerfile
    environment:
      A2_DATABASE_URL: postgresql://waydex:${POSTGRES_PASSWORD:?}@postgres:5432/waydex
      A2_DATABASE_SCHEMA: waydex
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    image: waydex-web:${WAYDEX_REVISION:?}
    build:
      context: ${SOURCE_DIR:?}
      dockerfile: ${WAYDEX_CONFIG_DIR:?}/web.Dockerfile
    volumes:
      - ./nginx.http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-app.conf:/etc/nginx/waydex-app.conf:ro
      - ${WAYDEX_ACME_DIR:-/var/www/waydex-acme}:/var/www/waydex-acme:ro
    ports:
      - "${WAYDEX_HTTP_BIND:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
