root /usr/share/nginx/html;
server_tokens off;
resolver 127.0.0.11 valid=10s ipv6=off;
set $general_api waydex-defense-connections:8000;
set $defense_api waydex-defense-cao:8000;
set $defense_web waydex-defense-web:8080;
# The upstream listens over HTTP. Translate only the exact public origin.
set $waydex_origin $http_origin;
if ($http_origin = "https://waydex.mhimf.net") { set $waydex_origin "http://waydex.mhimf.net"; }
proxy_set_header Origin $waydex_origin;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 105s;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/waydex-acme;
    try_files $uri =404;
}
location = / { return 302 /map#atlas/address; }
location = /cao-atlas { return 302 /district; }
location ^~ /cao-atlas/ { return 302 /district; }
location = /.cao-preview-auth { return 404; }
location = /health { proxy_pass http://$general_api; }
location ^~ /api/v1/address-access/ { proxy_pass http://$defense_api; }
location ^~ /cao-api/v1/ {
    rewrite ^/cao-api(/.*)$ /api$1 break;
    proxy_pass http://$defense_api;
}
location ^~ /api/v1/ { proxy_pass http://$general_api; }
location / { proxy_pass http://$defense_web; }
