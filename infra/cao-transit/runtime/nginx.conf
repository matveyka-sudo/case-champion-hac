map "$http_x_forwarded_proto:$http_origin" $cao_origin {
    default $http_origin;
    "https:https://waydex.mhimf.net" "http://waydex.mhimf.net";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api waydex-cao-transit-api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $cao_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;

    location = /health { proxy_pass http://$api; }
    location = /cao { return 302 /#atlas?analysis=cao-walk-500m; }
    location = / { try_files /index.html =404; }
    location ~ ^/api/v1/(capabilities|territories|consultant/ask|analyses|jobs/cao-(walk|transit)-500m-[0-9]+-[0-3]+|analyses/cao-(walk|transit)-500m(-[0-9]+-[0-3]+)?/(explanation|scenarios))$ {
        client_max_body_size 16k;
        proxy_pass http://$api;
    }
    location ~ ^/api/v1/analyses/cao-(walk|transit)-500m(-[0-9]+-[0-3]+)?$ {
        gzip on;
        gzip_types application/json;
        gzip_vary on;
        gzip_proxied no-store;
        gzip_comp_level 4;
        proxy_pass http://$api;
    }
    location /api/v1/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
