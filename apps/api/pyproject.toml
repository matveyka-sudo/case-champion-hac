[project]
name = "a2-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2-assistant",
    "a2-contracts",
    "a2-data-pipeline",
    "a2-engine",
    "alembic>=1,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "structlog",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["uv_build==0.12.17"]
build-backend = "uv_build"

[tool.uv.sources]
a2-assistant = { workspace = true }
a2-contracts = { workspace = true }
a2-data-pipeline = { workspace = true }
a2-engine = { workspace = true }
