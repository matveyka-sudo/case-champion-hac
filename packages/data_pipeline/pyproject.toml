[project]
name = "a2-data-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2-contracts",
    "a2-engine",
    "beautifulsoup4>=4,<5",
    "httpx",
    "lxml",
    "numpy>=2,<3",
    "openpyxl>=3.1,<4",
    "osmium>=4,<5",
    "pandas",
    "pyarrow",
    "pydantic>=2,<3",
    "pyproj>=3.6,<4",
    "rasterio>=1.4,<2",
    "shapely>=2,<3",
]

[build-system]
requires = ["uv_build==0.12.17"]
build-backend = "uv_build"

[tool.uv.sources]
a2-contracts = { workspace = true }
a2-engine = { workspace = true }
