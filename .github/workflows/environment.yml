name: Bootstrap environment

on:
  push:
    branches: [main, dev, 'work/**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.17'
      - name: Verify Python lock and install the workspace
        run: |
          uv lock --check
          uv sync --frozen --all-packages --group dev
          uv pip check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm ls --depth=0
          npm run build
          npm run lint
      - name: Validate current product configuration
        run: python3 scripts/check_product_config.py
      - name: Verify installed API entrypoint
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/a2-api-smoke
        run: |
          uv sync --frozen --package a2-api --no-default-groups
          workspace_python="$UV_PROJECT_ENVIRONMENT/bin/python"
          uv pip check --python "$workspace_python"
          check_dir=$(mktemp -d)
          trap 'rm -rf "$check_dir"' EXIT
          cd "$check_dir"
          "$workspace_python" -I - <<'PYTHON'
          from a2_api.app import create_configured_app
          from a2_api.providers import rasp

          routes = create_configured_app().openapi()["paths"]
          assert "/health" in routes and "/api/v1/capabilities" in routes
          PYTHON
      - name: Validate PostgreSQL Compose configuration
        run: docker compose --env-file .env.example config --quiet
