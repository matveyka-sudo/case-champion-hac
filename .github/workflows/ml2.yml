name: Accepted data pipeline

on:
  push:
    branches: [main, dev, 'work/**']
    paths: ['packages/data_pipeline/**', 'packages/contracts/**', 'packages/engine/**', 'data/**', 'pyproject.toml', 'uv.lock', '.github/workflows/ml2.yml']
  pull_request:
    branches: [dev, main]
    paths: ['packages/data_pipeline/**', 'packages/contracts/**', 'packages/engine/**', 'data/**', 'pyproject.toml', 'uv.lock', '.github/workflows/ml2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.17'
      - name: Install frozen workspace
        run: |
          uv lock --check
          uv sync --frozen --all-packages --group dev
          uv pip check
          .venv/bin/python -I -c 'import a2_data_pipeline, a2_contracts, a2_engine'
      - name: Validate data pipeline independently
        run: .venv/bin/python -m pytest -q -rs -o asyncio_default_fixture_loop_scope=function packages/data_pipeline/tests
